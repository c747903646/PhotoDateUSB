plugins {
    id 'com.android.application'
}

android {
    namespace 'com.photodateusb.organizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.photodateusb.organizer'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            // For personal installation use the automatically signed debug APK.
            // A release APK requires you to configure your own signing key.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
